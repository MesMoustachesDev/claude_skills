# Flutter / Dart. Valeurs par défaut des scripts du pipeline pour un package Flutter ; la config du projet
# (bloc ini de .claude/rules/feature_pipeline.md) prime clé par clé. Lu par ~/.claude/scripts/stack.sh.
priority = 10
markers = pubspec.yaml
extensions = .dart
# Fichiers de dépendances qu'un reproducer peut toucher pour brancher un runner de test (/fix).
manifests = pubspec.yaml, pubspec.lock
# Chemins de test, relatifs au package ; `*` traverse les `/`.
test_globs = test/*, */test/*, integration_test/*, */integration_test/*, *_test.dart, *.feature
# Dossiers du code et des tests, relatifs au package : zones d'écriture des agents, périmètre du gauntlet.
src_dirs = lib
test_dirs = test
# Le manifeste du package lui-même : ses dépendances (architect, test-writer pour une dev_dependency).
package_manifest = pubspec.yaml
# Couche data / domain / injection des étapes 3 et 4 en deux moitiés, relative au package (`*` traverse les `/`).
layer.data = lib/src/data, lib/src/domain, lib/src/injection, test/src/data, test/src/domain, test/src/injection
# Vues et widgets, relatifs au package : la zone du polish visuel.
presentation_dirs = lib/src/presentation
# Fichiers de l'outil, à la racine du projet ou de l'app, qu'une feature peut toucher (gate footprint).
tool_files = .fvmrc
# Fichiers de contrat du pipeline /feature (étape 0e).
contract_globs = */domain/*, */keys.dart, *_event.dart, *_state.dart
generated.exclude = *.g.dart, *.freezed.dart, *.mocks.dart, *.gr.dart, *.gen.dart, *.config.dart, app_localizations*.dart, **/l10n/generated/**, **/generated_l10n/**
flutter = flutter
dart = dart
test_cmd = {flutter} test
analyze_cmd = {flutter} analyze --fatal-warnings
format_cmd = {dart} format
# Tests donnés en argument, sortie lisible (relecture /reviewPR : run-tests, probe).
test_files_cmd = {flutter} test --reporter expanded
# Où /reviewPR pose un test jetable le temps d'un run, relatif au package.
probe_dir = test/_review_probe
# Avant les checks d'une PR, dans chaque package touché (pr_gauntlet.sh).
prepare_cmd = {flutter} pub get
# Fichier de verrou qui suit le manifeste (pr_gauntlet.sh : manifeste changé sans son verrou).
lock_file = pubspec.lock
# Doctrine : chargée par Claude Code quand un fichier .dart est lu (frontmatter paths).
rules = ~/.claude/rules/stacks/flutter.md
templates = ~/.claude/stacks/flutter/templates
