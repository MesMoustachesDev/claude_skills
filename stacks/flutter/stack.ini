# Flutter / Dart. Valeurs par défaut des scripts du pipeline pour un package Flutter ; la config du projet
# (bloc ini de .claude/rules/feature_pipeline.md) prime clé par clé. Lu par ~/.claude/scripts/stack.sh.
priority = 10
markers = pubspec.yaml
extensions = .dart
# Fichiers de dépendances qu'un reproducer peut toucher pour brancher un runner de test (/fix).
manifests = pubspec.yaml, pubspec.lock
# Chemins de test, relatifs au package ; `*` traverse les `/`.
test_globs = test/*, */test/*, integration_test/*, */integration_test/*, *_test.dart, *.feature
# Fichiers de contrat du pipeline /feature (étape 0e).
contract_globs = */domain/*, */keys.dart, *_event.dart, *_state.dart
generated.exclude = *.g.dart, *.freezed.dart, *.mocks.dart, *.gr.dart, *.gen.dart, *.config.dart, app_localizations*.dart, **/l10n/generated/**, **/generated_l10n/**
flutter = flutter
dart = dart
test_cmd = {flutter} test
analyze_cmd = {flutter} analyze --fatal-warnings
format_cmd = {dart} format
# Doctrine : chargée par Claude Code quand un fichier .dart est lu (frontmatter paths).
rules = ~/.claude/rules/stacks/flutter.md
templates = ~/.claude/stacks/flutter/templates
