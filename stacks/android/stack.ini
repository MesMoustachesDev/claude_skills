# Android natif (Kotlin, Gradle, Jetpack Compose). Valeurs par défaut des scripts du pipeline pour un module
# Gradle ; la config du projet (bloc ini de .claude/rules/feature_pipeline.md) prime clé par clé. Lu par
# ~/.claude/scripts/stack.sh. Chaque clé est documentée dans stacks/flutter/stack.ini ; ici, ce qui diffère.
priority = 20
markers = settings.gradle.kts, settings.gradle, build.gradle.kts, build.gradle
extensions = .kt, .kts, .java
manifests = build.gradle.kts, build.gradle, settings.gradle.kts, settings.gradle, gradle/libs.versions.toml, gradle.properties
test_globs = src/test/*, */src/test/*, src/androidTest/*, */src/androidTest/*, *Test.kt
# Le package est un module Gradle : son code vit sous src/main, ses tests sous src/test (JVM) et
# src/androidTest (instrumentés, sur appareil).
src_dirs = src/main
test_dirs = src/test, src/androidTest
package_manifest = build.gradle.kts, build.gradle
# Le package Kotlin se glisse entre src/<ensemble>/ et la couche (`*` traverse les `/`).
layer.data = src/main/*/data, src/main/*/domain, src/main/*/di, src/test/*/data, src/test/*/domain, src/test/*/di
presentation_dirs = src/main/*/ui, src/main/*/presentation
tool_files = gradle/wrapper/gradle-wrapper.properties
# Contrats de l'étape 0e : le domaine (entités, interfaces de repository, use cases), l'UiState et les
# événements du ViewModel, les testTags.
contract_globs = */domain/*, *UiState.kt, *UiEvent.kt, *TestTags.kt
# Rien de ce que Gradle, KSP, kapt, Hilt, Room ou les ressources générées écrivent n'est jugé.
generated.exclude = **/build/**, *_Factory.kt, *_HiltModules*.kt, *_MembersInjector.kt, Hilt_*.kt, *_Impl.kt, *_Impl.java, BuildConfig.java, R.java
probe_dir = src/test/kotlin/review_probe

# --- Commandes ---------------------------------------------------------------------------------------
# Le wrapper, relatif à la racine Gradle (le dossier de settings.gradle.kts).
gradle = ./gradlew
# Lanceur commun : trouve la racine Gradle et le chemin du module depuis le dossier courant, préfixe les
# tâches qui commencent par `:` (`:testDebugUnitTest` → `:feature:login:testDebugUnitTest`), traduit des
# fichiers de test en `--tests <classe>`. Il lance {gradle}.
gradle_run = ~/.claude/stacks/android/gradle_run.sh
# Tâches par type de module : Android (com.android.*) ou Kotlin/JVM pur (un module domaine). `:@unitTest`,
# `:@compile`, `:@lint` dans une commande les choisissent d'après le build du module (gradle_run.sh).
unit_test_task = testDebugUnitTest
jvm_unit_test_task = test
compile_task = compileDebugUnitTestKotlin
jvm_compile_task = compileTestKotlin
lint_task = lintDebug
jvm_lint_task = lint
test_cmd = {gradle_run} :@unitTest
test_files_cmd = {gradle_run} :@unitTest
analyze_cmd = {gradle_run} :@compile :@lint
lint_cmd = {gradle_run} :@lint
# Formatage : ktlint (org.jlleitschuh.gradle.ktlint) ou Spotless, selon ce que le projet applique.
format_cmd = {gradle_run} :ktlintFormat
# Gradle résout les dépendances au build : rien à préparer avant une PR.
prepare_cmd =
# Gradle n'a de verrou que si le projet active le dependency locking : la config du projet le dit.
lock_file =

# Android CLI (developer.android.com/tools/agents) : previews Compose rendues sans appareil
# (`preview render --component-tree`), hiérarchie de l'écran (`layout`), émulateurs (`emulator`).
# `--no-metrics` coupe la télémétrie. Option absente des options globales de la référence en ligne au
# 2026-11-06 (--sdk, -v, -V) : à vérifier avec `android --help` à l'installation, sinon la retirer ici.
android = android --no-metrics
rules = ~/.claude/rules/stacks/android.md
templates = ~/.claude/stacks/android/templates
