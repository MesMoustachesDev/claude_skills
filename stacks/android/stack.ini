# Android natif (Kotlin, Gradle, Jetpack Compose). Ébauche : les checks et la doctrine arrivent au point 6
# du plan .claude/plans/langages.md. Lu par ~/.claude/scripts/stack.sh.
priority = 20
markers = settings.gradle.kts, settings.gradle, build.gradle.kts, build.gradle
extensions = .kt, .kts, .java
manifests = build.gradle.kts, build.gradle, settings.gradle.kts, settings.gradle, gradle/libs.versions.toml, gradle.properties
test_globs = src/test/*, */src/test/*, src/androidTest/*, */src/androidTest/*, *Test.kt
src_dirs = src/main
test_dirs = src/test, src/androidTest
package_manifest = build.gradle.kts, build.gradle
# Ébauche : le package Kotlin se glisse entre src/<ensemble>/ et la couche (`*` traverse les `/`).
layer.data = src/main/*/data, src/main/*/domain, src/main/*/di, src/test/*/data, src/test/*/domain, src/test/*/di
presentation_dirs = src/main/*/ui, src/main/*/presentation
contract_globs = */domain/*
generated.exclude = **/build/**
probe_dir = src/test/kotlin/review_probe
gradle = ./gradlew
test_cmd = {gradle} test
lint_cmd = {gradle} lint
format_cmd = {gradle} ktlintFormat
# Android CLI (developer.android.com/tools/agents) : previews Compose sans appareil, hiérarchie d'écran,
# émulateurs. `--no-metrics` coupe la télémétrie.
android = android --no-metrics
rules = ~/.claude/rules/stacks/android.md
templates = ~/.claude/stacks/android/templates
