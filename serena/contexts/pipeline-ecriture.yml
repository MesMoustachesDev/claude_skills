# Contexte Serena du pipeline, écriture (ADR 0018, amendement écriture) : implementer, ses deux moitiés,
# cleaner. Passé par `scripts/serena.sh serve --ecriture`. Liste fermée : les six outils de lecture, plus
# trois outils qui remplacent ou ajoutent un symbole entier. Le hook passe leur fichier (`relative_path`)
# par la zone de Edit. Ni safe_delete_symbol (il casse une variable ou un champ, et refuse une classe
# inutilisée qui a un constructeur : les suppressions passent par Edit), ni rename_symbol (il réécrit des
# fichiers que le hook ne voit pas, dont les tests gelés). `prompt: null`, comme en lecture.
description: Pipeline - écriture (implementer, cleaner)
prompt: null
excluded_tools: []
included_optional_tools: []
fixed_tools:
  - find_symbol
  - get_symbols_overview
  - find_referencing_symbols
  - find_implementations
  - find_declaration
  - get_diagnostics_for_file
  - replace_symbol_body
  - insert_after_symbol
  - insert_before_symbol
tool_description_overrides: {}
single_project: true
structured_tool_output: false
