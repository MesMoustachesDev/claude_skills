# Contexte Serena du pipeline, lecture seule (ADR 0018). Passé par chemin à `--context` par
# scripts/serena.sh. `fixed_tools` est une liste fermée : tout autre outil, présent ou d'une version
# future de Serena (serena_repl, execute_shell_command, éditions, mémoires, rename_symbol…), est exclu.
# `prompt: null` : pas de doctrine Serena qui contredirait le pipeline (le contexte `claude-code` livré
# interdit Read et Edit). Ce fichier n'est pas la barrière : les hooks *-restrict-writes.sh gardent leur
# propre liste fermée, parce qu'un `.serena/project.yml` peut l'emporter sur le contexte.
description: Pipeline - lecture seule
prompt: null
excluded_tools: []
included_optional_tools: []
fixed_tools:
  - find_symbol
  - get_symbols_overview
  - find_referencing_symbols
  - find_implementations
  - find_declaration
  - get_diagnostics_for_file
tool_description_overrides: {}
single_project: true
structured_tool_output: false
